<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Quiz Game</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --yellow: #FFE600;
    --dark: #0a0a14;
    --card: #141428;
    --border: #2a2a4a;
    --green: #00c853;
    --red: #ff4444;
    --blue: #4488ff;
    --text: #e0e0f0;
    --muted: #888;
  }
  body { background: var(--dark); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

  header { text-align: center; padding: 18px 16px 12px; border-bottom: 1px solid var(--border); }
  .badge { display: inline-block; background: var(--yellow); color: #000; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; letter-spacing: 1px; margin-bottom: 6px; }
  h1 { font-size: 20px; font-weight: 800; color: var(--yellow); letter-spacing: 1px; }
  .team-tag { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .team-tag strong { color: var(--text); }

  main { flex: 1; max-width: 540px; width: 100%; margin: 0 auto; padding: 20px 16px; }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ── WAITING ── */
  .wait-icon { font-size: 64px; text-align: center; margin: 28px 0 14px; }
  .wait-title { text-align: center; font-size: 22px; font-weight: 700; }
  .wait-sub { text-align: center; color: var(--muted); margin-top: 8px; font-size: 14px; }
  .info-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 18px; }
  .info-title { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
  .rule-item { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .rule-item:last-child { border-bottom: none; }
  .rule-icon { font-size: 18px; flex-shrink: 0; }
  .round-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .round-item:last-child { border-bottom: none; }
  .round-count { color: var(--muted); font-size: 13px; }

  .btn-ready { width: 100%; padding: 18px; border: none; border-radius: 12px; background: var(--yellow); color: #000; font-size: 18px; font-weight: 800; cursor: pointer; margin-top: 22px; letter-spacing: 1px; transition: opacity .2s, transform .1s; }
  .btn-ready:active { transform: scale(0.98); }
  .btn-ready:disabled { opacity: 0.5; cursor: default; transform: none; }
  .ready-msg { display: none; text-align: center; margin-top: 14px; color: var(--green); font-weight: 700; font-size: 16px; }

  /* ── ROUND INTRO ── */
  .round-icon { font-size: 72px; text-align: center; margin: 36px 0 12px; }
  .round-label { text-align: center; font-size: 12px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .round-name { text-align: center; font-size: 28px; font-weight: 800; color: var(--yellow); margin-top: 6px; }

  /* ── QUESTION ── */
  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .q-round { font-size: 12px; color: var(--muted); }
  .q-counter { font-size: 12px; color: var(--muted); }
  .q-timer { font-size: 40px; font-weight: 900; color: var(--yellow); font-family: monospace; text-align: center; margin-bottom: 6px; line-height: 1; }
  .q-timer.urgent { color: var(--red); animation: urgpulse .5s infinite; }
  .q-timer.done { color: var(--muted); font-size: 28px; }
  @keyframes urgpulse { 0%,100%{opacity:1} 50%{opacity:.6} }
  .timer-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 18px; overflow: hidden; }
  .timer-fill { height: 100%; background: var(--yellow); border-radius: 3px; transition: width 1s linear; }
  .timer-fill.urgent { background: var(--red); }
  .q-text { font-size: 18px; font-weight: 700; line-height: 1.5; margin-bottom: 18px; white-space: pre-line; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt { width: 100%; padding: 15px 18px; border-radius: 10px; border: 2px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; font-weight: 600; text-align: left; cursor: pointer; transition: all .12s; display: flex; align-items: center; gap: 12px; }
  .opt:active { transform: scale(0.98); }
  .opt:hover:not(:disabled) { border-color: var(--yellow); background: rgba(255,230,0,.07); }
  .opt:disabled { cursor: default; transform: none; }
  .opt.selected { border-color: var(--blue); background: rgba(68,136,255,.1); }
  .opt.correct  { border-color: var(--green); background: rgba(0,200,83,.15); color: var(--green); font-weight: 700; }
  .opt.wrong    { border-color: var(--red); background: rgba(255,68,68,.08); opacity: 0.7; }
  .opt.correct-other { border-color: var(--green); background: rgba(0,200,83,.07); }
  .options.opts-2 { flex-direction: row; gap: 12px; }
  .options.opts-2 .opt { flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 28px 10px; font-size: 18px; text-align: center; }
  .options.opts-2 .opt-letter { margin-bottom: 6px; }
  .opt-letter { font-size: 13px; font-weight: 800; width: 28px; height: 28px; border-radius: 6px; background: var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .opt.selected .opt-letter    { background: var(--blue); color: #fff; }
  .opt.correct .opt-letter     { background: var(--green); color: #000; }
  .opt.wrong .opt-letter       { background: rgba(255,68,68,.3); }
  .opt.correct-other .opt-letter { background: var(--green); color: #000; }

  /* ── FINAL ── */
  .final-icon  { font-size: 80px; text-align: center; margin: 24px 0 8px; }
  .final-label { text-align: center; font-size: 12px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .final-name  { text-align: center; font-size: 30px; font-weight: 900; color: var(--yellow); margin-top: 4px; }
  .final-score { text-align: center; font-size: 16px; margin-top: 6px; color: var(--muted); }
  .podium { margin-top: 22px; }
  .pod-row { display: flex; align-items: center; padding: 12px 16px; border-radius: 10px; margin-bottom: 8px; gap: 10px; }
  .pod-row.first { background: rgba(255,230,0,.1); border: 1px solid var(--yellow); }
  .pod-row.other { background: var(--card); border: 1px solid var(--border); }
  .pod-pos  { font-size: 22px; width: 36px; flex-shrink: 0; }
  .pod-name { flex: 1; font-weight: 600; }
  .pod-you  { font-size: 11px; color: var(--yellow); font-weight: 700; margin-left: 6px; }
  .pod-pts  { font-weight: 800; font-size: 18px; color: var(--yellow); }
</style>
</head>
<body>

<header>
  <div class="badge" id="badge">🎮 QUIZ GAME</div>
  <h1 id="game-title">Cargando...</h1>
  <p class="team-tag">Tu equipo: <strong id="team-name-tag">...</strong></p>
</header>

<main>

  <!-- WAITING -->
  <div class="screen active" id="screen-waiting">
    <div class="wait-icon" id="wait-icon">🏁</div>
    <div class="wait-title" id="wait-title">Esperando al facilitador...</div>
    <div class="wait-sub" id="wait-sub">El juego comenzará pronto</div>
    <div class="info-box" id="rules-box">
      <div class="info-title">¿Cómo funciona?</div>
      <div id="rules-list"></div>
    </div>
    <div class="info-box" id="rounds-box" style="margin-top:12px;">
      <div class="info-title">Las rondas</div>
      <div id="rounds-list"></div>
    </div>
    <button class="btn-ready" id="btn-ready" onclick="confirmReady()">¡ESTAMOS LISTOS! →</button>
    <div class="ready-msg" id="ready-msg">✓ Confirmado — esperando al facilitador</div>
  </div>

  <!-- ROUND INTRO -->
  <div class="screen" id="screen-round">
    <div class="round-icon" id="round-icon">⚡</div>
    <div class="round-label">PRÓXIMA RONDA</div>
    <div class="round-name" id="round-name">Ronda</div>
  </div>

  <!-- QUESTION -->
  <div class="screen" id="screen-question">
    <div class="q-header">
      <span class="q-round" id="q-round-label"></span>
      <span class="q-counter" id="q-counter-label"></span>
    </div>
    <div class="q-timer" id="q-timer">8</div>
    <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="q-options"></div>
  </div>

  <!-- FINAL -->
  <div class="screen" id="screen-final">
    <div class="final-icon" id="final-icon">🏆</div>
    <div class="final-label">RESULTADO FINAL</div>
    <div class="final-name" id="final-name"></div>
    <div class="final-score" id="final-score"></div>
    <div class="podium" id="final-podium"></div>
  </div>

</main>

<script>
const socket = io();
const teamId = parseInt(window.location.pathname.split('/').pop());
let isReady = false;
let selectedAnswer = null;
let timerInterval = null;
let myScore = 0;

fetch('/api/config').then(r => r.json()).then(cfg => {
  const team = cfg.teams.find(t => t.id === teamId);
  document.getElementById('badge').textContent = '🎮 ' + cfg.title.toUpperCase();
  document.getElementById('game-title').textContent = cfg.title;
  document.title = cfg.title + (team ? ' — ' + team.name : '');

  if (team) {
    document.getElementById('wait-icon').textContent = team.emoji || '🏁';
    document.getElementById('team-name-tag').textContent = (team.emoji || '') + ' ' + team.name;
  }

  document.getElementById('rules-list').innerHTML = [
    { icon: '🔄', text: cfg.totalRounds + ' rondas · ' + cfg.totalQuestions + ' preguntas en total' },
    { icon: '👥', text: 'Solo <strong>una persona</strong> por equipo toca la pantalla — ¡decidan juntos!' },
    { icon: '🎯', text: '1 punto por respuesta correcta, 0 por incorrecta o sin respuesta' },
    { icon: '⚡', text: '8 segundos por pregunta' },
  ].map(r => '<div class="rule-item"><div class="rule-icon">' + r.icon + '</div><div>' + r.text + '</div></div>').join('');

  document.getElementById('rounds-list').innerHTML = cfg.rounds.map(r =>
    '<div class="round-item"><span>' + r.emoji + ' ' + r.name + '</span><span class="round-count">' + r.count + ' preguntas</span></div>'
  ).join('');
});

socket.emit('team:join', { teamId: teamId });

socket.on('team:state', function(state) {
  myScore = (state.scores && state.scores[teamId]) || 0;
  if (state.status === 'finished') showScreen('screen-final');
});

socket.on('game:start', function() {
  document.getElementById('wait-title').textContent = '¡El juego comenzó!';
  document.getElementById('wait-sub').textContent = 'Primera pregunta llegando...';
  document.getElementById('btn-ready').style.display = 'none';
  document.getElementById('ready-msg').style.display = 'none';
  document.getElementById('rules-box').style.display = 'none';
  document.getElementById('rounds-box').style.display = 'none';
});

socket.on('round:start', function(data) {
  document.getElementById('round-icon').textContent = data.roundEmoji || '⚡';
  document.getElementById('round-name').textContent = data.roundName;
  showScreen('screen-round');
});

socket.on('question:show', function(q) {
  selectedAnswer = null;
  clearInterval(timerInterval);
  renderQuestion(q);
  showScreen('screen-question');
  startTimer(q.timeLimit);
});

socket.on('question:reveal', function(data) {
  clearInterval(timerInterval);
  var correctIndex = data.correctIndex;
  var myAnswer = data.answers && data.answers[teamId];

  var btns = document.querySelectorAll('#q-options .opt');
  for (var i = 0; i < btns.length; i++) {
    btns[i].disabled = true;
    btns[i].classList.remove('selected');
    if (i === correctIndex) {
      btns[i].classList.add(myAnswer && myAnswer.answerIndex === i ? 'correct' : 'correct-other');
    } else if (myAnswer && myAnswer.answerIndex === i) {
      btns[i].classList.add('wrong');
    }
  }

  var correct = myAnswer && myAnswer.answerIndex === correctIndex;
  var timer = document.getElementById('q-timer');
  timer.textContent = correct ? '✓' : '✗';
  timer.className = 'q-timer done';
  document.getElementById('timer-fill').style.width = '0%';
});

socket.on('game:end', function(data) {
  myScore = (data.scores && data.scores[teamId]) || 0;
  renderFinal(data.rankings);
  showScreen('screen-final');
});

socket.on('game:reset', function() { location.reload(); });

function confirmReady() {
  if (isReady) return;
  isReady = true;
  socket.emit('team:ready', { teamId: teamId });
  var btn = document.getElementById('btn-ready');
  btn.disabled = true;
  btn.textContent = '✓ ¡Listos!';
  document.getElementById('ready-msg').style.display = 'block';
  document.getElementById('wait-title').textContent = '¡Listos! Esperando al facilitador...';
}

function renderQuestion(q) {
  document.getElementById('q-round-label').textContent = (q.roundEmoji || '') + ' ' + q.roundName;
  document.getElementById('q-counter-label').textContent = (q.questionIndex + 1) + '/' + q.totalInRound;
  document.getElementById('q-text').textContent = q.text;

  var letters = ['A','B','C','D'];
  var container = document.getElementById('q-options');
  container.className = 'options' + (q.options.length === 2 ? ' opts-2' : '');
  container.innerHTML = q.options.map(function(opt, i) {
    return '<button class="opt" id="opt-' + i + '" onclick="selectAnswer(' + i + ')">' +
      '<div class="opt-letter">' + letters[i] + '</div>' +
      '<span>' + opt + '</span>' +
      '</button>';
  }).join('');
}

function selectAnswer(index) {
  if (selectedAnswer !== null) return;
  selectedAnswer = index;
  document.getElementById('opt-' + index).classList.add('selected');
  document.querySelectorAll('#q-options .opt').forEach(function(b) { b.disabled = true; });
  var timeLeft = parseInt(document.getElementById('q-timer').textContent) || 0;
  socket.emit('team:answer', { teamId: teamId, answerIndex: index, timeLeft: Math.max(0, timeLeft) });
}

function startTimer(limit) {
  var t = limit;
  updateTimer(t, limit);
  timerInterval = setInterval(function() {
    t--;
    updateTimer(t, limit);
    if (t <= 0) {
      clearInterval(timerInterval);
      document.querySelectorAll('#q-options .opt').forEach(function(b) { b.disabled = true; });
    }
  }, 1000);
}

function updateTimer(secs, total) {
  var el = document.getElementById('q-timer');
  el.textContent = Math.max(0, secs);
  el.className = 'q-timer' + (secs <= 3 && secs > 0 ? ' urgent' : '');
  var fill = document.getElementById('timer-fill');
  fill.style.width = (total > 0 ? (secs / total) * 100 : 0) + '%';
  fill.className = 'timer-fill' + (secs <= 3 ? ' urgent' : '');
}

function renderFinal(rankings) {
  var myRank = rankings.findIndex(function(t) { return t.id === teamId; });
  var winner = rankings[0];
  var isWinner = winner.id === teamId;
  var medals = ['🥇','🥈','🥉'];
  document.getElementById('final-icon').textContent = medals[myRank] || '🎖️';
  document.getElementById('final-name').textContent = isWinner
    ? '¡' + winner.name + ' ganó!'
    : 'Ganó: ' + (winner.emoji || '') + ' ' + winner.name;
  document.getElementById('final-score').textContent = 'Tu puntaje: ' + myScore + ' punto' + (myScore !== 1 ? 's' : '');
  document.getElementById('final-podium').innerHTML = rankings.map(function(t, i) {
    return '<div class="pod-row ' + (i === 0 ? 'first' : 'other') + '">' +
      '<div class="pod-pos">' + (medals[i] || (i+1)+'. ') + '</div>' +
      '<div class="pod-name">' + (t.emoji || '') + ' ' + t.name +
        (t.id === teamId ? '<span class="pod-you">← TÚ</span>' : '') + '</div>' +
      '<div class="pod-pts">' + (t.score || 0) + ' pts</div>' +
      '</div>';
  }).join('');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
